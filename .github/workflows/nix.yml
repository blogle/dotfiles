name: Nix

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  changes:
    name: Detect Nix changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.changes.outputs.relevant }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check whether Nix configuration changed
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$BASE_SHA" || -z "$GITHUB_SHA" ]] || ! git cat-file -e "${BASE_SHA}^{commit}" || ! git cat-file -e "${GITHUB_SHA}^{commit}"; then
            echo "Unable to identify both diff commits; refusing to skip Nix validation." >&2
            exit 1
          fi

          relevant=false
          while IFS= read -r path; do
            case "$path" in
              flake.nix|flake.lock|home/*|hosts/*|modules/*|pkgs/*|scripts/*|secrets/*|.github/workflows/nix.yml)
                relevant=true
                break
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")

          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          if [[ "$relevant" == "false" ]]; then
            echo "No Nix inputs changed; skipping flake evaluation and Nix target builds."
          fi

  flake-check:
    name: Flake check
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Check flake evaluation
        run: nix flake check --no-build --print-build-logs

  build:
    name: Build ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: home
            target: .#homeConfigurations.home.activationPackage

          - name: modulus
            target: .#nixosConfigurations.modulus.config.system.build.toplevel

          - name: nandstorm
            target: .#nixosConfigurations.nandstorm.config.system.build.toplevel

    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Build ${{ matrix.name }}
        run: nix build --no-link --print-build-logs "${{ matrix.target }}"
