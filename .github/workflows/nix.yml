name: SDLC

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  pr-fast:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    uses: blogle/sdlc/.github/workflows/pr-fast.yml@v1.1.0

  pr-fast-gate:
    name: sdlc / pr-fast
    needs: pr-fast
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require reusable pr-fast workflow success
        env:
          RESULT: ${{ needs.pr-fast.result }}
        run: test "$RESULT" = success

  candidate:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'mergify/merge-queue/')
    uses: blogle/sdlc/.github/workflows/candidate.yml@v1.1.0

  candidate-gate:
    name: sdlc / candidate
    needs: candidate
    if: always() && github.event_name == 'pull_request' && startsWith(github.head_ref, 'mergify/merge-queue/')
    runs-on: ubuntu-latest
    steps:
      - name: Require reusable candidate workflow success
        env:
          RESULT: ${{ needs.candidate.result }}
        run: test "$RESULT" = success
