name: Nix

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  changes:
    name: Detect Nix changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.changes.outputs.relevant }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check whether Nix configuration changed
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$BASE_SHA" || -z "$GITHUB_SHA" ]] || ! git cat-file -e "${BASE_SHA}^{commit}" || ! git cat-file -e "${GITHUB_SHA}^{commit}"; then
            echo "Unable to identify both diff commits; refusing to skip Nix validation." >&2
            exit 1
          fi

          relevant=false
          while IFS= read -r path; do
            case "$path" in
              flake.nix|flake.lock|home/*|hosts/*|modules/*|pkgs/*|scripts/*|secrets/*|.github/workflows/nix.yml)
                relevant=true
                break
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")

          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          if [[ "$relevant" == "false" ]]; then
            echo "No Nix inputs changed; skipping flake evaluation and Nix target builds."
          fi

  flake-check:
    name: Flake check
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Check flake evaluation
        run: nix flake check --no-build --print-build-logs

  build:
    name: Build ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: home
            target: .#homeConfigurations.home.activationPackage

          - name: modulus
            target: .#nixosConfigurations.modulus.config.system.build.toplevel

          - name: nandstorm
            target: .#nixosConfigurations.nandstorm.config.system.build.toplevel

    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Restore targeted Nix output cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dotfiles-nix-cache-${{ matrix.name }}
          key: ${{ runner.os }}-dotfiles-${{ matrix.name }}-${{ hashFiles('flake.lock') }}-${{ hashFiles('flake.nix', 'home/**', 'hosts/**', 'modules/**', 'pkgs/**', 'scripts/**', 'secrets/**') }}
          restore-keys: |
            ${{ runner.os }}-dotfiles-${{ matrix.name }}-${{ hashFiles('flake.lock') }}-
      - name: Restore cached repo output
        shell: bash
        run: |
          set -euo pipefail
          cache_dir="$RUNNER_TEMP/dotfiles-nix-cache-${{ matrix.name }}"
          if [[ -s "$cache_dir/roots" ]]; then
            nix copy --no-check-sigs --no-recursive --from "file://$cache_dir" $(<"$cache_dir/roots")
          fi
      - name: Build ${{ matrix.name }}
        shell: bash
        run: |
          set -euo pipefail
          cache_dir="$RUNNER_TEMP/dotfiles-nix-cache-${{ matrix.name }}"
          mkdir -p "$cache_dir"

          output="$(nix build --no-link --print-out-paths --print-build-logs "${{ matrix.target }}")"
          printf '%s\n' "$output" > "$cache_dir/roots.new"
          nix copy --no-check-sigs --no-recursive --to "file://$cache_dir" "$output"
          mv "$cache_dir/roots.new" "$cache_dir/roots"
