name: SDLC PR fast (transitional)

# Transitional until dotfiles exposes the shared SDLC v1 consumer contract/hydraJobs.
on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-fast:
    name: sdlc / pr-fast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v19
      - run: nix flake check --no-build
