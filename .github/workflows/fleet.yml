name: SDLC fleet
on:
  pull_request:
    paths:
      - fleet.yml
      - .github/workflows/fleet.yml
  push:
    branches: [master]
  schedule:
    - cron: '31 * * * *'
permissions:
  contents: read
jobs:
  manifest:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v23
      - id: matrix
        run: |
          set -euo pipefail
          repos="$(nix run nixpkgs#yq-go -- -o=json fleet.yml | jq -c '[. as $fleet | .repos[] | select(.enabled == true) | {owner: $fleet.owner, repo: .name}]')"
          echo "value=$repos" >> "$GITHUB_OUTPUT"
  validate:
    if: github.event_name == 'pull_request'
    needs: manifest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJSON(needs.manifest.outputs.matrix) }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: Check consumer entry without credentials
        env:
          REPOSITORY: ${{ matrix.repo.owner }}/${{ matrix.repo.repo }}
        run: |
          nix run "github:$REPOSITORY#sdlc" -- enable --repo "$REPOSITORY" --dry-run
  reconcile:
    if: github.event_name != 'pull_request'
    needs: manifest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJSON(needs.manifest.outputs.matrix) }}
    steps:
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: actions/create-github-app-token@v2
        id: fleet
        with:
          app-id: ${{ secrets.SDLC_FLEET_APP_ID }}
          private-key: ${{ secrets.SDLC_FLEET_APP_PRIVATE_KEY }}
          owner: ${{ matrix.repo.owner }}
          repositories: ${{ matrix.repo.repo }}
      - name: Apply consumer-pinned ruleset and distribute release credentials
        env:
          GH_TOKEN: ${{ steps.fleet.outputs.token }}
          REPOSITORY: ${{ matrix.repo.owner }}/${{ matrix.repo.repo }}
          RELEASE_APP_ID: ${{ secrets.SDLC_RELEASE_APP_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.SDLC_RELEASE_APP_PRIVATE_KEY }}
          RELEASE_CREDENTIAL_VERSION: ${{ vars.SDLC_RELEASE_CREDENTIAL_VERSION }}
        run: |
          set -euo pipefail
          : "${RELEASE_APP_ID:?missing SDLC release App ID}"
          : "${RELEASE_APP_PRIVATE_KEY:?missing SDLC release App private key}"
          nix run "github:$REPOSITORY#sdlc" -- enable --repo "$REPOSITORY"
          rulesets_json="$(gh api --paginate "repos/$REPOSITORY/rulesets")"
          ruleset_id="$(jq -sre '
            add | map(select(.name == "SDLC default branch"))
            | if length == 1 then .[0].id else error("expected exactly one canonical SDLC ruleset") end
          ' <<<"$rulesets_json")"
          ruleset_json="$(gh api "repos/$REPOSITORY/rulesets/$ruleset_id")"
          jq -e '
            type == "object"
            and (.id != null)
            and (.updated_at | type == "string")
            and has("bypass_actors")
            and (.bypass_actors | type == "array")
            and (.bypass_actors | length == 0)
          ' <<<"$ruleset_json" >/dev/null
          variables_json="$(gh variable list --repo "$REPOSITORY" --json name)"
          installed_secrets="$(gh secret list --repo "$REPOSITORY" --json name)"
          has_credential_version="$(jq -r 'any(.[]; .name == "SDLC_RELEASE_CREDENTIAL_VERSION")' <<<"$variables_json")"
          if [[ "$has_credential_version" == true ]]; then
            installed_version="$(gh variable get SDLC_RELEASE_CREDENTIAL_VERSION --repo "$REPOSITORY")"
          else
            installed_version=''
          fi
          ruleset_attestation="$(jq -c --arg repository "$REPOSITORY" '
            {
              schema: 1,
              repository: $repository,
              ruleset_id: .id,
              updated_at: .updated_at,
              bypass_actors: []
            }
          ' <<<"$ruleset_json")"
          gh variable set SDLC_RULESET_ATTESTATION --repo "$REPOSITORY" --body "$ruleset_attestation"
          credential_version="${RELEASE_CREDENTIAL_VERSION:-1}"
          if [[ "$installed_version" != "$credential_version" || "$(jq -r 'any(.[]; .name == "SDLC_RELEASE_APP_ID")' <<<"$installed_secrets")" != true ]]; then
            printf '%s' "$RELEASE_APP_ID" | gh secret set SDLC_RELEASE_APP_ID --repo "$REPOSITORY"
          fi
          if [[ "$installed_version" != "$credential_version" || "$(jq -r 'any(.[]; .name == "SDLC_RELEASE_APP_PRIVATE_KEY")' <<<"$installed_secrets")" != true ]]; then
            printf '%s' "$RELEASE_APP_PRIVATE_KEY" | gh secret set SDLC_RELEASE_APP_PRIVATE_KEY --repo "$REPOSITORY"
          fi
          if [[ "$installed_version" != "$credential_version" ]]; then
            gh variable set SDLC_RELEASE_CREDENTIAL_VERSION --repo "$REPOSITORY" --body "$credential_version"
          fi
          if [[ "$(jq -r 'any(.[]; .name == "SDLC_RELEASE_ACTIVATE")' <<<"$variables_json")" != true ]]; then
            gh variable set SDLC_RELEASE_ACTIVATE --repo "$REPOSITORY" --body false
          fi
          has_bot_login="$(jq -r 'any(.[]; .name == "SDLC_RELEASE_BOT_LOGIN")' <<<"$variables_json")"
          bot_login=''
          if [[ "$has_bot_login" == true ]]; then
            bot_login="$(gh variable get SDLC_RELEASE_BOT_LOGIN --repo "$REPOSITORY")"
          fi
          if [[ "$bot_login" != 'sdlc-release[bot]' ]]; then
            gh variable set SDLC_RELEASE_BOT_LOGIN --repo "$REPOSITORY" --body 'sdlc-release[bot]'
          fi
