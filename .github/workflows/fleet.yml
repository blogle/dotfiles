name: SDLC fleet

on:
  pull_request:
    paths:
      - fleet/manifest.yaml
      - scripts/fleet-controller.py
      - scripts/test-fleet-controller.py
      - scripts/test-fleet-cli-contract.sh
      - .github/workflows/fleet.yml
  push:
    branches: [master]
    paths:
      - fleet/manifest.yaml
      - scripts/fleet-controller.py
      - scripts/test-fleet-controller.py
      - scripts/test-fleet-cli-contract.sh
      - .github/workflows/fleet.yml
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      bootstrap_pr90:
        description: Use the current exact head of Anvil PR 90 for first-canary bootstrap
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

jobs:
  plan:
    name: fleet / read-only Anvil plan
    runs-on: ubuntu-latest
    steps:
      - uses: DeterminateSystems/nix-installer-action@786fff0690178f1234e4e1fe9b536e94f5433196 # v20
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate inventory
        run: |
          python3 -m unittest scripts/test-fleet-controller.py
          python3 scripts/fleet-controller.py validate
          python3 scripts/fleet-controller.py plan
      - name: Select Anvil read-only target
        id: anvil-ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ref="$(gh api repos/blogle/anvil/pulls/90 --jq .head.sha)"
          test -n "$ref"
          printf 'ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: blogle/anvil
          ref: ${{ steps.anvil-ref.outputs.ref }}
          path: anvil
          persist-credentials: false
      - name: Run the consumer's Nix-native read-only policy plan
        env:
          ANVIL_DIR: ${{ github.workspace }}/anvil
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/test-fleet-cli-contract.sh

  reconcile:
    name: fleet / Anvil policy and release
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: DeterminateSystems/nix-installer-action@786fff0690178f1234e4e1fe9b536e94f5433196 # v20
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Create the explicitly enabled Anvil-only App token
        if: vars.SDLC_FLEET_APPLY == '1'
        id: fleet-app
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.SDLC_FLEET_APP_ID }}
          private-key: ${{ secrets.SDLC_FLEET_APP_PRIVATE_KEY }}
          owner: blogle
          repositories: anvil
          permission-administration: write
          permission-contents: read
          permission-secrets: write
          permission-variables: write
      - name: Select protected Anvil target
        id: anvil-ref
        env:
          GH_TOKEN: ${{ github.token }}
          BOOTSTRAP_PR90: ${{ inputs.bootstrap_pr90 }}
        run: |
          set -euo pipefail
          if test "$BOOTSTRAP_PR90" = true; then
            ref="$(gh api repos/blogle/anvil/pulls/90 --jq .head.sha)"
          else
            test "$GITHUB_EVENT_NAME" != workflow_dispatch || test "$BOOTSTRAP_PR90" = false
            ref=main
          fi
          test -n "$ref"
          printf 'ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: blogle/anvil
          ref: ${{ steps.anvil-ref.outputs.ref }}
          path: anvil
          token: ${{ steps.fleet-app.outputs.token || github.token }}
          persist-credentials: false
      - name: Plan Anvil policy from its checked-out flake
        working-directory: anvil
        env:
          GH_TOKEN: ${{ steps.fleet-app.outputs.token || github.token }}
        run: nix run .#sdlc -- policy plan --repo blogle/anvil
      - name: Apply and verify Anvil policy
        if: vars.SDLC_FLEET_APPLY == '1'
        working-directory: anvil
        env:
          GH_TOKEN: ${{ steps.fleet-app.outputs.token }}
        run: |
          set -euo pipefail
          nix run .#sdlc -- policy apply --repo blogle/anvil
          nix run .#sdlc -- policy check --repo blogle/anvil
      - name: Install release credentials in Anvil repository secrets
        if: vars.SDLC_FLEET_APPLY == '1' && vars.SDLC_FLEET_RELEASE_ENABLE == '1'
        env:
          GH_TOKEN: ${{ steps.fleet-app.outputs.token }}
          SDLC_RELEASE_APP_ID: ${{ secrets.SDLC_RELEASE_APP_ID }}
          SDLC_RELEASE_APP_PRIVATE_KEY: ${{ secrets.SDLC_RELEASE_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SDLC_RELEASE_APP_ID"
          test -n "$SDLC_RELEASE_APP_PRIVATE_KEY"
          gh secret set SDLC_RELEASE_APP_ID --repo blogle/anvil --body "$SDLC_RELEASE_APP_ID"
          gh secret set SDLC_RELEASE_APP_PRIVATE_KEY --repo blogle/anvil --body "$SDLC_RELEASE_APP_PRIVATE_KEY"
      - name: Enable Anvil release last
        if: vars.SDLC_FLEET_APPLY == '1' && vars.SDLC_FLEET_RELEASE_ENABLE == '1'
        env:
          GH_TOKEN: ${{ steps.fleet-app.outputs.token }}
        run: gh variable set SDLC_RELEASE_ACTIVATE --repo blogle/anvil --body true
