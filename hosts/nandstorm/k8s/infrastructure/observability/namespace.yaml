---
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    # Lets Prometheus Operator discover monitors/probes deployed in this namespace.
    # kube-prometheus-stack is configured with empty (match-all) selectors so
    # cross-namespace discovery does not depend on this label, but it remains
    # a useful convention for future namespace-scoped rollouts.
    pod-security.kubernetes.io/enforce: privileged
---
# Bounded storage budget for the entire observability platform. The sum of
# planned active and rollback PVCs (prometheus 32Gi + loki 40Gi + tempo
# 20Gi + grafana 4Gi + alertmanager 2Gi = 98Gi) fits under this 128Gi cap.
# The old claims remain for rollback, so the quota covers both.
# for the WAL, compaction, index, and filesystem overhead quoted in the spec.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: observability-storage-budget
  namespace: observability
spec:
  hard:
    requests.storage: 128Gi
    persistentvolumeclaims: "16"
