---
# Registry of cert-expiry alerts: the http_2xx module surfaces
# `probe_ssl_earliest_cert_expiry` so the alert-rules.yaml PrometheusRule
# can warn before certs lapse. The TLS-validity requirement from the spec
# is met by Probe success (validating the chain) plus the expiry metric
# surface — alert logic lives in alert-rules.yaml once a cert-warning rule
# is added.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: tcp-check-observability-tempo
  namespace: observability
  labels:
    app.kubernetes.io/part-of: observability
spec:
  interval: 60s
  scrapeTimeout: 5s
  module: tcp_connect
  prober:
    url: blackbox-exporter-prometheus-blackbox-exporter.observability.svc.cluster.local:9115
    scheme: http
    path: /probe
  targets:
    staticConfig:
      static:
        - tempo.observability.svc.cluster.local:3200
        - loki-gateway.observability.svc.cluster.local:80
        - alloy-otel.observability.svc.cluster.local:4317
