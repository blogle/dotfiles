---
# Probe (Prometheus Operator CRD) definitions for synthetic checks of
# self-hosted services deployed in this repo. Each Probe scans a target
# URL through blackbox-exporter at the spec's `lowValueServiceScrapeInterval`
# cadence (60s) — they're "is it up"-style checks, not high-value
# infrastructure.
#
# All targets are publicly-resolvable TLS hostnames fronted by Traefik + the
# letsencrypt ClusterIssuer + tinyauth forward-auth. Probe success implies
# HTTPS availability AND a valid TLS chain (blackbox's http_2xx also exposes
# `ssl_cert_not_after_seconds` for cert-expiry alerting and dashboards).
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: grafana-public
  namespace: observability
  labels:
    app.kubernetes.io/part-of: observability
spec:
  interval: 60s
  scrapeTimeout: 10s
  module: http_2xx
  prober:
    url: blackbox-exporter-prometheus-blackbox-exporter.observability.svc.cluster.local:9115
    scheme: http
    path: /probe
  targets:
    staticConfig:
      static:
        - https://grafana.thejeffer.net
