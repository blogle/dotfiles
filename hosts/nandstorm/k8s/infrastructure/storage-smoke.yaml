apiVersion: v1
kind: Namespace
metadata:
  name: storage-smoke
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zfs-smoke
  namespace: storage-smoke
spec:
  storageClassName: openebs-zfspv
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: zfs-smoke
  namespace: storage-smoke
spec:
  restartPolicy: Always
  containers:
    - name: smoke
      image: busybox:1.37.0
      command: ["sh", "-c", "test -f /data/sentinel && cat /data/sentinel || { date -u > /data/sentinel; sync; }; sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: zfs-smoke
