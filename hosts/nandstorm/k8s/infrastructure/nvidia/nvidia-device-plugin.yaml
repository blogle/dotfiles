apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: nvidia-device-plugin
  template:
    metadata:
      labels:
        app: nvidia-device-plugin
    spec:
      # CDI hooks execute in the host namespace. NixOS has no FHS
      # /usr/bin/nvidia-ctk, while the plugin-generated CDI spec assumes it.
      # Repair that stable hook path before registering the plugin. The NixOS
      # configuration creates the same symlink during normal host activation.
      initContainers:
      - name: install-nvidia-ctk-hook
        image: alpine@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
        command:
        - /bin/sh
        - -ec
        - |
          toolkit=""
          for candidate in /nix/store/*-nvidia-container-toolkit-1.18.2/bin/nvidia-ctk; do
            [ -x "$candidate" ] && toolkit="$candidate"
          done
          [ -n "$toolkit" ]
          ln -sf "$toolkit" /host/usr/bin/nvidia-ctk
          test -x /host/usr/bin/nvidia-ctk
        securityContext:
          privileged: true
        volumeMounts:
        - name: host-usr-bin
          mountPath: /host/usr/bin
        - name: nix-store
          mountPath: /nix/store
          readOnly: true
      containers:
      - name: nvidia-device-plugin
        image: nvcr.io/nvidia/k8s-device-plugin:v0.19.2
        args:
        - "--fail-on-init-error=false"
        # Use the host-generated nvidia.com/gpu CDI spec. The plugin-generated
        # cdi-cri spec assumes an FHS host hook path, which NixOS does not have.
        - "--device-list-strategy=cdi-annotations"
        - "--device-id-strategy=index"
        env:
        - name: LD_LIBRARY_PATH
          value: /run/opengl-driver/lib
        - name: NVIDIA_CTK_LIBCUDA_DIR
          value: /driver-root/lib64
        securityContext:
          privileged: true
        volumeMounts:
        - name: device-plugin
          mountPath: /var/lib/kubelet/device-plugins
        - name: cdi
          mountPath: /var/run/cdi
        - name: opengl-driver
          mountPath: /run/opengl-driver
          readOnly: true
        - name: nix-store
          mountPath: /nix/store
          readOnly: true
        - name: opengl-driver-driver-root
          mountPath: /driver-root/run/opengl-driver
          readOnly: true
        - name: nix-store-driver-root
          mountPath: /driver-root/nix/store
          readOnly: true
        - name: opengl-driver-lib64-driver-root
          mountPath: /driver-root/lib64
          readOnly: true
        - name: dev-driver-root
          mountPath: /driver-root/dev
          readOnly: true
        - name: dev-nvidiactl
          mountPath: /dev/nvidiactl
        - name: dev-nvidia0
          mountPath: /dev/nvidia0
        - name: dev-nvidia1
          mountPath: /dev/nvidia1
        - name: dev-nvidia2
          mountPath: /dev/nvidia2
        - name: dev-nvidia-uvm
          mountPath: /dev/nvidia-uvm
        - name: dev-nvidia-uvm-tools
          mountPath: /dev/nvidia-uvm-tools
        - name: dev-nvidia-modeset
          mountPath: /dev/nvidia-modeset
      volumes:
      - name: host-usr-bin
        hostPath:
          path: /usr/bin
          type: DirectoryOrCreate
      - name: device-plugin
        hostPath:
          path: /var/lib/kubelet/device-plugins
      - name: cdi
        hostPath:
          path: /var/run/cdi
      - name: opengl-driver
        hostPath:
          path: /run/opengl-driver
      - name: nix-store
        hostPath:
          path: /nix/store
      - name: opengl-driver-driver-root
        hostPath:
          path: /run/opengl-driver
      - name: nix-store-driver-root
        hostPath:
          path: /nix/store
      - name: opengl-driver-lib64-driver-root
        hostPath:
          path: /run/opengl-driver/lib
      - name: dev-driver-root
        hostPath:
          path: /dev
      - name: dev-nvidiactl
        hostPath:
          path: /dev/nvidiactl
      - name: dev-nvidia0
        hostPath:
          path: /dev/nvidia0
      - name: dev-nvidia1
        hostPath:
          path: /dev/nvidia1
      - name: dev-nvidia2
        hostPath:
          path: /dev/nvidia2
      - name: dev-nvidia-uvm
        hostPath:
          path: /dev/nvidia-uvm
      - name: dev-nvidia-uvm-tools
        hostPath:
          path: /dev/nvidia-uvm-tools
      - name: dev-nvidia-modeset
        hostPath:
          path: /dev/nvidia-modeset
