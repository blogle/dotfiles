apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - github.com/blogle/openhands-agent-sandbox//deploy/base?ref=v0.1.3
  - runtime-secrets.sealed.yaml
  - bootstrap-key.sealed.yaml
  - ingress.yaml

patches:
  - path: adapter-deployment.patch.yaml
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: openhands-runtime-adapter
      namespace: openhands-sandboxes
    path: runtime-image.patch.yaml
  - target:
      group: extensions.agents.x-k8s.io
      version: v1beta1
      kind: SandboxTemplate
      name: openhands-default
      namespace: openhands-sandboxes
    patch: |-
      - op: replace
        path: /spec/podTemplate/spec/containers/0/image
        value: ghcr.io/openhands/agent-server:1.37.1-python

configMapGenerator:
  - name: openhands-runtime-config
    behavior: merge
    literals:
      - PUBLIC_BASE_URL=https://openhands-runtime.thejeffer.net
      - LOG_LEVEL=info
      - LOG_FORMAT=json
