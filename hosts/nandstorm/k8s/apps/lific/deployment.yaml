apiVersion: apps/v1
kind: Deployment
metadata:
  name: lific
  namespace: lific
  labels:
    app.kubernetes.io/name: lific
    app.kubernetes.io/instance: lific
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: lific
      app.kubernetes.io/instance: lific
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lific
        app.kubernetes.io/instance: lific
    spec:
      imagePullSecrets:
        - name: lific-ghcr-pull
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        # Lific tightens its config file to mode 0600 at startup, which a
        # ConfigMap mount cannot support. Copy the declarative source into a
        # writable, pod-local file owned by the runtime user.
        - name: prepare-config
          image: busybox:1.36
          command:
            - /bin/sh
            - -ec
            - cp /config-source/lific.toml /etc/lific/lific.toml && chown 65532:65532 /etc/lific/lific.toml && chmod 600 /etc/lific/lific.toml
          volumeMounts:
            - name: lific-config-source
              mountPath: /config-source
              readOnly: true
            - name: lific-config
              mountPath: /etc/lific
        # Ensure the data directory is owned by the runtime user and has proper permissions.
        - name: fix-data-permissions
          image: busybox:1.36
          command:
            - /bin/sh
            - -ec
            - chown -R 65532:65532 /data && chmod -R 700 /data
          volumeMounts:
            - name: lific-data
              mountPath: /data
      containers:
        - name: lific
          image: ghcr.io/blogle/lific@sha256:27ad9b7c585c57c9b07ac56222afe776e31ac767b34785d312b644eb9de6e1b7
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          command: ["/usr/local/bin/lific", "start", "--config", "/etc/lific/lific.toml"]
          ports:
            - containerPort: 3456
              name: http
              protocol: TCP
          volumeMounts:
            - name: lific-data
              mountPath: /data
            - name: lific-config
              mountPath: /etc/lific
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3456
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3456
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: lific-data
          persistentVolumeClaim:
            claimName: lific-data
        - name: lific-config-source
          configMap:
            name: lific-config
        - name: lific-config
          emptyDir: {}
        - name: tmp
          emptyDir: {}
