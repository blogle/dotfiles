apiVersion: v1
kind: ConfigMap
metadata:
  name: telegram-collector-config
  namespace: knowledge
data:
  config.yaml: |
    timezone: America/Los_Angeles
    telegram:
      api_id_env: TELEGRAM_API_ID
      api_hash_env: TELEGRAM_API_HASH
      session_path: /state/telegram.session
      phone_env: TELEGRAM_PHONE
      code_env: TELEGRAM_CODE
      password_env: TELEGRAM_PASSWORD
    state:
      database: /state/state.sqlite3
      archive_root: /state/archive
      work: /state/work
    output:
      root: /output
      attachment_root: /output/Attachments
    health:
      listen: 0.0.0.0:8080
    streams:
      - chat_id: -5184613712
        slug: mud-room
        title: Mud Room
        output_subdirectory: Mud Room
        backfill:
          from: 2026-07-01
      - chat_id: -1003944547386
        slug: player
        title: Player
        output_subdirectory: Player
        backfill:
          from: 2026-07-01
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegram-collector
  namespace: knowledge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: telegram-collector
  template:
    metadata:
      labels:
        app: telegram-collector
    spec:
      terminationGracePeriodSeconds: 30
      nodeSelector:
        kubernetes.io/hostname: nandstorm
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: telegram-collector
          image: ghcr.io/blogle/telegram-markdown-collector:v0.1.0
          args:
            - --config
            - /etc/telegram-collector/config.yaml
            - watch
          env:
            - name: TELEGRAM_API_ID
              valueFrom:
                secretKeyRef:
                  name: telegram-credentials
                  key: TELEGRAM_API_ID
            - name: TELEGRAM_API_HASH
              valueFrom:
                secretKeyRef:
                  name: telegram-credentials
                  key: TELEGRAM_API_HASH
          ports:
            - name: health
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/telegram-collector/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: state
              mountPath: /state
            - name: vault
              mountPath: /output
      volumes:
        - name: config
          configMap:
            name: telegram-collector-config
        - name: state
          persistentVolumeClaim:
            claimName: telegram-collector-state
        - name: vault
          hostPath:
            path: /persist/knowledge/vaults/The Chadlands/70 Sources/Telegram
            type: Directory
---
apiVersion: batch/v1
kind: Job
metadata:
  name: telegram-collector-auth
  namespace: knowledge
spec:
  suspend: true
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: telegram-collector-auth
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      nodeSelector:
        kubernetes.io/hostname: nandstorm
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: telegram-collector
          image: ghcr.io/blogle/telegram-markdown-collector:v0.1.0
          stdin: true
          tty: true
          args:
            - --config
            - /etc/telegram-collector/config.yaml
            - auth
          envFrom:
            - secretRef:
                name: telegram-credentials
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/telegram-collector/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: state
              mountPath: /state
      volumes:
        - name: config
          configMap:
            name: telegram-collector-config
        - name: state
          persistentVolumeClaim:
            claimName: telegram-collector-state
