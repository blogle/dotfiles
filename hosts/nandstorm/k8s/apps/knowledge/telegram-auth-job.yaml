apiVersion: batch/v1
kind: Job
metadata:
  name: telegram-collector-auth
  namespace: knowledge
spec:
  suspend: true
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: telegram-collector-auth
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      nodeSelector:
        kubernetes.io/hostname: nandstorm
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: telegram-collector
          image: ghcr.io/blogle/telegram-markdown-collector:v0.1.0
          stdin: true
          tty: true
          args:
            - --config
            - /etc/telegram-collector/config.yaml
            - auth
          envFrom:
            - secretRef:
                name: telegram-credentials
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/telegram-collector/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: state
              mountPath: /state
            - name: vault
              mountPath: /output
      volumes:
        - name: config
          configMap:
            name: telegram-collector-config
        - name: state
          persistentVolumeClaim:
            claimName: telegram-collector-state-zfs
        - name: vault
          hostPath:
            path: /persist/knowledge/vaults/The Chadlands/70 Sources/Telegram
            type: Directory
