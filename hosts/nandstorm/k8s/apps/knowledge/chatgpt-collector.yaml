apiVersion: v1
kind: ConfigMap
metadata:
  name: chatgpt-collector-config
  namespace: knowledge
data:
  config.yaml: |
    exporter:
      executable: chatgpt-exporter
      supports_token_env: true
      concurrency: 3
      delay_ms: 250
      timeout_ms: 600000
    auth:
      preflight: true
    token_env: CHATGPT_TOKEN
    state_dir: /state
    output_dir: /output
    projects:
      - id: g-p-6a629addfee081918dfd830673e02acd
        name: The Chadlands
        output: .
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: chatgpt-collector
  namespace: knowledge
spec:
  # Manual-only until renewable authentication is available.
  suspend: true
  schedule: "30 3 * * *"
  timeZone: America/Los_Angeles
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Authentication failures require intervention; do not retry the same token.
      backoffLimit: 0
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app: chatgpt-collector
        spec:
          restartPolicy: Never
          terminationGracePeriodSeconds: 30
          nodeSelector:
            kubernetes.io/hostname: nandstorm
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            runAsNonRoot: true
          containers:
            - name: chatgpt-collector
              image: ghcr.io/blogle/chatgpt-markdown-collector:v0.1.0
              args:
                - sync
                - --config
                - /etc/chatgpt-collector/config.yaml
              env:
                - name: CHATGPT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: chatgpt-credentials
                      key: CHATGPT_TOKEN
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              volumeMounts:
                - name: config
                  mountPath: /etc/chatgpt-collector/config.yaml
                  subPath: config.yaml
                  readOnly: true
                - name: state
                  mountPath: /state
                - name: vault
                  mountPath: /output
          volumes:
            - name: config
              configMap:
                name: chatgpt-collector-config
            - name: state
              persistentVolumeClaim:
                claimName: chatgpt-collector-state
            - name: vault
              hostPath:
                path: /persist/knowledge/vaults/The Chadlands/70 Sources/Strategy Sessions/Raw Export
                type: Directory
