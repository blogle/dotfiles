apiVersion: v1
kind: ServiceAccount
metadata:
  name: openhands
  namespace: openhands
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: openhands-headless
  namespace: openhands
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: openhands
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: openhands
  namespace: openhands
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: openhands
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openhands
  namespace: openhands
spec:
  serviceName: openhands-headless
  replicas: 1
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: openhands
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openhands
    spec:
      serviceAccountName: openhands
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      initContainers:
        - name: state-permissions
          image: busybox:1.37.0
          command:
            - sh
            - -c
            - mkdir -p /state/openhands /state/workspace && chown 10001:10001 /state /state/openhands /state/workspace && chmod 0770 /state /state/openhands /state/workspace
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, DAC_OVERRIDE, FOWNER]
          volumeMounts:
            - name: state
              mountPath: /state
      containers:
        - name: agent-canvas
          image: ghcr.io/openhands/agent-canvas:1.16.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: PORT
              value: "8000"
            - name: AGENT_SERVER_PORT
              value: "18000"
            - name: AUTOMATION_PORT
              value: "18001"
          startupProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /alive
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: state
              mountPath: /home/openhands/.openhands
              subPath: openhands
            - name: state
              mountPath: /home/openhands/workspace
              subPath: workspace
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: openhands-state
