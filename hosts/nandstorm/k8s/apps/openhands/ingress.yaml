apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openhands
  namespace: openhands
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: auth-sso-errors@kubernetescrd,auth-sso-auth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - openhands.thejeffer.net
      secretName: openhands-tls
  rules:
    - host: openhands.thejeffer.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openhands
                port:
                  name: http
