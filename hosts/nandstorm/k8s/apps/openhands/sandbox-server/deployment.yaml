apiVersion: apps/v1
kind: Deployment
metadata:
  name: openhands-sandbox-server
  namespace: openhands
  labels:
    app.kubernetes.io/name: sandbox-server
    app.kubernetes.io/part-of: openhands
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sandbox-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sandbox-server
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 42420
        runAsGroup: 42420
        fsGroup: 42420
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sandbox-server
          image: ghcr.io/blogle/openhands-sandbox-server@sha256:9d6de002f42b098a5249ab1db7cb0d0856e4c9a5085d1cf943d05b428f2c3085
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: RUNTIME
              value: remote
            - name: SANDBOX_REMOTE_RUNTIME_API_URL
              value: http://openhands-runtime-adapter.openhands-sandboxes.svc.cluster.local
            - name: SANDBOX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openhands-runtime-adapter-client
                  key: api-key
            - name: OH_PERSISTENCE_DIR
              value: /data
            - name: AGENT_SERVER_IMAGE_REPOSITORY
              value: ghcr.io/openhands/agent-server
            - name: AGENT_SERVER_IMAGE_TAG
              value: 1.37.1-python
            - name: LLM_MODEL
              value: openai/qwen3.8:27b
            - name: LLM_BASE_URL
              value: http://ollama.ai.svc.cluster.local:11434/v1
            - name: LLM_API_KEY
              value: local-llm
            - name: OH_AGENT_SERVER_ENV
              value: '{"OH_ALLOW_CORS_ORIGINS_0":"https://openhands.thejeffer.net"}'
            - name: OH_PERMITTED_CORS_ORIGINS_0
              value: https://openhands.thejeffer.net
          command:
            - /app/.venv/bin/python
            - -m
            - uvicorn
            - compatibility:app
            - --host
            - 0.0.0.0
            - --port
            - "3000"
          volumeMounts:
            - name: state
              mountPath: /data
            - name: compatibility
              mountPath: /app/compatibility.py
              subPath: compatibility.py
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: openhands-sandbox-server-state
        - name: compatibility
          configMap:
            name: openhands-sandbox-server-compatibility
