apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-server
  namespace: openhands
  labels:
    app.kubernetes.io/name: sandbox-server
    app.kubernetes.io/part-of: openhands
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sandbox-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sandbox-server
    spec:
      # The upstream entrypoint requires root (it creates an "enduser" account).
      # With NO_SETUP=true the entrypoint is a passthrough; root is still
      # required by the entrypoint's id-check.  See UPSTREAM.md.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 42420
        runAsGroup: 42420
        fsGroup: 10001
      containers:
        - name: sandbox-server
          # blogle/openhands-sandbox-server
          # Built from OpenHands/sandbox-server@f19f9e0d88272bb393e39e8cbcb78e3e8aa633a3
          # containers/app/Dockerfile, unmodified.
          image: ghcr.io/blogle/openhands-sandbox-server:f19f9e0d88272bb393e39e8cbcb78e3e8aa633a3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            # Bypass the entrypoint's user-setup / Docker-socket checks.
            - name: NO_SETUP
              value: "true"
            # Remote runtime mode — sandbox-server delegates sandbox lifecycle
            # to the blogle/openhands-agent-sandbox adapter via HTTP.
            - name: RUNTIME
              value: "remote"
            - name: SANDBOX_REMOTE_RUNTIME_API_URL
              value: "http://openhands-runtime-adapter.openhands-sandboxes.svc.cluster.local"
            - name: SANDBOX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sandbox-server-api-key
                  key: api-key
            # File-store persistence (conversations, events, settings).
            - name: OH_PERSISTENCE_DIR
              value: "/.openhands"
            - name: FILE_STORE
              value: "local"
            - name: FILE_STORE_PATH
              value: "/.openhands"
            # LLM — reuse the cluster-local Ollama instance.
            - name: OLLAMA_BASE_URL
              value: "http://ollama.ai.svc.cluster.local:11434"
            # Public URL for CORS and webhook callbacks.
            - name: WEB_HOST
              value: "openhands-control.thejeffer.net"
            # Disable frontend serving (Canvas is a separate deployment).
            - name: SERVE_FRONTEND
              value: "false"
          volumeMounts:
            - name: state
              mountPath: /.openhands
              subPath: openhands
          startupProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /alive
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: sandbox-server-state-zfs
