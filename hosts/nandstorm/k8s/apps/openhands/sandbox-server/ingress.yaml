apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: openhands-sandbox-server-cors
  namespace: openhands
spec:
  headers:
    accessControlAllowOriginList:
      - https://openhands.thejeffer.net
    accessControlAllowMethods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    accessControlAllowHeaders:
      - Authorization
      - Content-Type
    accessControlAllowCredentials: true
    accessControlMaxAge: 600
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openhands-sandbox-server-control
  namespace: openhands
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: openhands-openhands-sandbox-server-cors@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: openhands-control.thejeffer.net
      http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: openhands-sandbox-server
                port:
                  number: 3000
          - path: /api/keys/current
            pathType: Exact
            backend:
              service:
                name: openhands-sandbox-server
                port:
                  number: 3000
          - path: /api/organizations
            pathType: Prefix
            backend:
              service:
                name: openhands-sandbox-server
                port:
                  number: 3000
  tls:
    - hosts:
        - openhands-control.thejeffer.net
      secretName: openhands-control-tls
