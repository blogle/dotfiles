apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dojo-staging

resources:
# Uses the upstream Dojo base from the rebuilt repository.
- github.com/blogle/dojo2//deploy/k8s/base?ref=master
- namespace.yaml
- volumes.yaml
- ingress.yaml

images:
- name: ghcr.io/blogle/dojo2
  newName: ghcr.io/blogle/dojo2
  newTag: staging

patches:
- target:
    group: ""
    version: v1
    kind: PersistentVolumeClaim
    name: dojo-data
  patch: |-
    - op: add
      path: /spec/volumeName
      value: dojo-staging-pv
    - op: add
      path: /spec/storageClassName
      value: ""
- path: keel-annotations.patch.yaml
- path: pod-spec.patch.yaml
