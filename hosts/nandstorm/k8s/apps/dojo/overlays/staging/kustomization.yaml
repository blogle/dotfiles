apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dojo-staging

resources:
# Uses the upstream Dojo base from the rebuilt repository.
- github.com/blogle/dojo2//deploy/k8s/base?ref=master
- namespace.yaml
- ingress.yaml
- dojo-google-oauth-sealed.yaml

images:
- name: ghcr.io/blogle/dojo2
  newName: ghcr.io/blogle/dojo2
  digest: sha256:1bac7fda0026414f83697038ef53f0cf69a7240839770ceb5b0cdb55d5a52d3f

patches:
- path: pod-spec.patch.yaml
- path: backup-cronjob.patch.yaml
- target:
    kind: ClusterRoleBinding
    name: dojo-backup-snapshot-classes
  patch: |-
    - op: replace
      path: /metadata/name
      value: dojo-backup-snapshot-classes-staging

patchesStrategicMerge:
- delete-base-pvc.patch.yaml
