apiVersion: apps/v1
kind: Deployment
metadata:
  name: dojo
spec:
  template:
    spec:
      initContainers:
      - name: fix-permissions
        image: ghcr.io/blogle/dojo2:v0.0.1
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c", "chown -R 1000:1000 /data"]
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: data
          mountPath: /data
      containers:
      - name: dojo
        env:
        - name: FRONTEND_BASE_URL
          value: https://dojo.thejeffer.net
        - name: CORS_ALLOWED_ORIGINS
          value: https://dojo.thejeffer.net
