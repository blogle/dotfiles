apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dojo-prod

resources:
- github.com/blogle/dojo2//deploy/k8s/base?ref=master
- namespace.yaml
- ingress.yaml
- dojo-google-oauth-sealed.yaml

images:
- name: ghcr.io/blogle/dojo2
  newTag: v0.0.1

patches:
- path: pod-spec.patch.yaml
- target:
    kind: ServiceAccount
    name: dojo-backup
  patch: |-
    - op: replace
      path: /metadata/name
      value: dojo-backup-prod
- target:
    kind: ClusterRole
    name: dojo-backup-snapshot-classes
  patch: |-
    - op: replace
      path: /metadata/name
      value: dojo-backup-snapshot-classes-prod
- target:
    kind: ClusterRoleBinding
    name: dojo-backup-snapshot-classes
  patch: |-
    - op: replace
      path: /metadata/name
      value: dojo-backup-snapshot-classes-prod
    - op: replace
      path: /roleRef/name
      value: dojo-backup-snapshot-classes-prod
    - op: replace
      path: /subjects/0/name
      value: dojo-backup-prod
    - op: replace
      path: /subjects/0/namespace
      value: dojo-prod

patchesStrategicMerge:
- delete-base-pvc.patch.yaml
