apiVersion: apps/v1
kind: Deployment
metadata:
  name: workspace-image-cache
  namespace: opencode-sandboxes
  labels:
    app.kubernetes.io/name: workspace-image-cache
    app.kubernetes.io/part-of: opencode-workspaces
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: workspace-image-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workspace-image-cache
        app.kubernetes.io/part-of: opencode-workspaces
    spec:
      automountServiceAccountToken: false
      containers:
        - name: runtime
          image: ghcr.io/blogle/opencode-runtime:5ef643aa035e9bf8467ed8955edce187ccbebd42
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -c, "sleep infinity"]
          resources:
            requests:
              cpu: 1m
              memory: 8Mi
            limits:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
        - name: generic-nix
          image: ghcr.io/blogle/opencode-generic-nix:5ef643aa035e9bf8467ed8955edce187ccbebd42
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -c, "sleep infinity"]
          resources:
            requests:
              cpu: 1m
              memory: 8Mi
            limits:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
