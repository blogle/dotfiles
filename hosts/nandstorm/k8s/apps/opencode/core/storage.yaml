kind: PersistentVolume
metadata:
  name: opencode-gateway-state
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - nandstorm
  hostPath:
    path: /persist/opencode/gateway
    type: DirectoryOrCreate
