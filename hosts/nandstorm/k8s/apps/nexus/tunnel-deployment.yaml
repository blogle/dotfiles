apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-tunnel
  namespace: nexus
  labels:
    app: nexus-tunnel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nexus-tunnel
  template:
    metadata:
      labels:
        app: nexus-tunnel
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: tunnel-client
          image: alpine@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
          command:
            - /bin/sh
            - -ec
            - |
              until nc -z nexus 8000; do
                sleep 1
              done
              exec /usr/local/bin/tunnel-client run
          env:
            - name: CONTROL_PLANE_TUNNEL_ID
              valueFrom:
                secretKeyRef:
                  name: nexus-tunnel-credentials
                  key: CONTROL_PLANE_TUNNEL_ID
            - name: CONTROL_PLANE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nexus-tunnel-credentials
                  key: CONTROL_PLANE_API_KEY
            - name: MCP_SERVER_URL
              value: http://nexus-mcp-compat.nexus.svc.cluster.local:8000/mcp
            - name: MCP_STARTUP_WAIT_TIMEOUT
              value: 60s
            - name: HEALTH_LISTEN_ADDR
              value: :8080
            - name: LOG_LEVEL
              value: info
            - name: LOG_FORMAT
              value: json
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /readyz
              port: health
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 30
            timeoutSeconds: 2
          volumeMounts:
            - name: tunnel-client
              mountPath: /usr/local/bin/tunnel-client
              readOnly: true
      volumes:
        - name: tunnel-client
          hostPath:
            path: /run/current-system/sw/bin/tunnel-client
            type: File
