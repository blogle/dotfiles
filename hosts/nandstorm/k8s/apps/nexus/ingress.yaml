apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexus
  namespace: nexus
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - nexus.thejeffer.net
      secretName: nexus-tls
  rules:
    - host: nexus.thejeffer.net
      http:
        paths:
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: nexus-mcp-compat
                port:
                  name: http
          - path: /health
            pathType: Exact
            backend:
              service:
                name: nexus
                port:
                  name: http
