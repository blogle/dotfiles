apiVersion: v1
kind: ConfigMap
metadata:
  name: maple-prometheus-receiver
  namespace: observability
data:
  config.yaml: |
    receivers:
      prometheus:
        config:
          global:
            scrape_interval: 60s
            scrape_timeout: 20s
          scrape_configs:
            - job_name: dcgm-exporter
              scrape_interval: 15s
              static_configs:
                - targets: [dcgm-exporter.kube-system.svc.cluster.local:9400]
            - job_name: exportarr-sonarr
              static_configs:
                - targets: [sonarr-exporter.media.svc.cluster.local:9704]
            - job_name: exportarr-radarr
              static_configs:
                - targets: [radarr-exporter.media.svc.cluster.local:9704]
            - job_name: exportarr-prowlarr
              static_configs:
                - targets: [prowlarr-exporter.media.svc.cluster.local:9704]
    exporters:
      otlp:
        endpoint: maple-k8s-infra-agent.observability.svc.cluster.local:4317
        tls:
          insecure: true
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 128
        spike_limit_mib: 32
      resource:
        attributes:
          - key: cluster
            value: nandstorm
            action: upsert
          - key: deployment.environment
            value: homelab
            action: upsert
      batch:
        timeout: 5s
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    service:
      extensions: [health_check]
      pipelines:
        metrics:
          receivers: [prometheus]
          processors: [memory_limiter, resource, batch]
          exporters: [otlp]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maple-prometheus-receiver
  namespace: observability
  labels:
    app.kubernetes.io/name: maple-prometheus-receiver
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: maple-prometheus-receiver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: maple-prometheus-receiver
    spec:
      automountServiceAccountToken: false
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.141.0
          args: [--config=/etc/otelcol/config.yaml]
          ports:
            - name: health
              containerPort: 13133
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 192Mi
          readinessProbe:
            httpGet:
              path: /
              port: 13133
          livenessProbe:
            httpGet:
              path: /
              port: 13133
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: maple-prometheus-receiver
