apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: clickstack-operators
  namespace: kube-system
spec:
  repo: https://clickhouse.github.io/ClickStack-helm-charts
  chart: clickstack-operators
  version: 1.1.0
  targetNamespace: observability
  createNamespace: true
  valuesContent: |-
    mongodb-operator:
      operator:
        watchedResources:
          - mongodbcommunity
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 512Mi

    clickhouse-operator:
      controller:
        watchNamespaces:
          - observability
      manager:
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
