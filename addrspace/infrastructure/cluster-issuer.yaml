apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    email: oglebrandon@gmail.com
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - dns01:
          cloudflare:
            email: oglebrandon@gmail.com
            apiKeySecretRef:
              name: cloudflare
              key: api-key
        selector: {}   # match all Certificate / Ingress requests
