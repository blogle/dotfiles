apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: openebs-zfspv
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: zfs.csi.openebs.io
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
parameters:
  # This dataset is created declaratively by NixOS and is not under k3s's
  # /var/lib/rancher tree. The driver creates one child dataset per PVC.
  poolname: "rpool/safe/kubernetes"
  fstype: "zfs"
  recordsize: "128k"
  compression: "lz4"
  dedup: "off"
  atime: "off"
  logbias: "throughput"
  thinprovision: "yes"
  quotatype: "refquota"
  shared: "yes"
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: openebs-zfspv-retain
provisioner: zfs.csi.openebs.io
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
parameters:
  poolname: "rpool/safe/kubernetes"
  fstype: "zfs"
  recordsize: "128k"
  compression: "lz4"
  dedup: "off"
  atime: "off"
  logbias: "throughput"
  thinprovision: "yes"
  quotatype: "refquota"
---
# Shared ZFS datasets cannot be published read-write and read-only at the same
# time (OpenEBS zfs-localpv #691 / OpenZFS mount semantics). Use a ZVOL-backed
# filesystem for workloads such as Anvil that intentionally mix those modes.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: openebs-zfspv-shared-ext4
provisioner: zfs.csi.openebs.io
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
parameters:
  poolname: "rpool/safe/kubernetes"
  fstype: "ext4"
  compression: "lz4"
  dedup: "off"
  thinprovision: "yes"
  shared: "yes"
