apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: addrspace-apps
  namespace: flux-system
spec:
  interval: 1m
  path: ./addrspace/apps
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: addrspace-platform
    - name: addrspace-clickstack
  timeout: 15m
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: nexus
      namespace: nexus
