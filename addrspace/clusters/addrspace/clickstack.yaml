apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: addrspace-clickstack
  namespace: flux-system
spec:
  interval: 1m
  path: ./addrspace/platform/observability/clickstack
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: addrspace-platform
    - name: addrspace-clickstack-operators
  timeout: 20m
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: clickstack-app
      namespace: observability
    - apiVersion: apps/v1
      kind: DaemonSet
      name: clickstack-otel-collector-agent
      namespace: observability
