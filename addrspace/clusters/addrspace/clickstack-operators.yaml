apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: addrspace-clickstack-operators
  namespace: flux-system
spec:
  interval: 1m
  path: ./addrspace/platform/observability/clickstack-operators
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: addrspace-platform
  timeout: 15m
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: clickstack-operators-clickhouse-operator-controller-manager
      namespace: observability
    - apiVersion: apps/v1
      kind: Deployment
      name: mongodb-kubernetes-operator
      namespace: observability
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: clickhouseclusters.clickhouse.com
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: keeperclusters.clickhouse.com
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: mongodbcommunity.mongodbcommunity.mongodb.com
