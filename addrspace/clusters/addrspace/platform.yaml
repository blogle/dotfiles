apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: addrspace-platform
  namespace: flux-system
spec:
  interval: 1m
  path: ./addrspace/platform
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: addrspace-infrastructure
  timeout: 15m
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: external-dns
      namespace: external-dns
    - apiVersion: apps/v1
      kind: DaemonSet
      name: maple-k8s-infra-agent
      namespace: observability
