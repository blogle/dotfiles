apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: latchkey
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: auth-sso-auth@kubernetescrd,auth-sso-errors@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - latchkey.thejeffer.net
      secretName: latchkey-tls
  rules:
    - host: latchkey.thejeffer.net
      http:
        paths:
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: latchkey
                port:
                  name: http
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: latchkey
                port:
                  name: http
          - path: /readyz
            pathType: Exact
            backend:
              service:
                name: latchkey
                port:
                  name: http
