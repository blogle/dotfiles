---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-pv
  labels: { app: media, component: library }
spec:
  capacity: { storage: 800Gi }
  accessModes: [ "ReadWriteOnce" ]
  volumeMode: Filesystem
  persistentVolumeReclaimPolicy: Retain
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values: [ "nandstorm" ]
  hostPath:
    path: /media
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-pvc
  namespace: media
spec:
  storageClassName: ""
  volumeName: media-pv
  accessModes: [ "ReadWriteOnce" ]
  resources:
    requests: { storage: 800Gi }
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: downloads-pv
  labels: { app: media, component: downloads }
spec:
  capacity: { storage: 250Gi }
  accessModes: [ "ReadWriteOnce" ]
  volumeMode: Filesystem
  persistentVolumeReclaimPolicy: Retain
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values: [ "nandstorm" ]
  hostPath:
    path: /media/downloads
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: downloads-pvc
  namespace: media
spec:
  storageClassName: ""
  volumeName: downloads-pv
  accessModes: [ "ReadWriteOnce" ]
  resources:
    requests: { storage: 250Gi }
