apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dojo-staging

resources:
- github.com/blogle/dojo2//deploy/k8s/base?ref=24329406863cb25416b71a04a6b5ceac0dd1dae2
- namespace.yaml
- ingress.yaml
- dojo-google-oauth-sealed.yaml

images:
- name: ghcr.io/blogle/dojo2
  newName: ghcr.io/blogle/dojo2
  newTag: git-24329406863cb25416b71a04a6b5ceac0dd1dae2

patches:
- path: pod-spec.patch.yaml
- path: backup-cronjob.patch.yaml
- target:
    kind: ServiceAccount
    name: dojo-backup
  patch: |-
    - op: replace
      path: /metadata/name
      value: dojo-backup-staging
- target:
    kind: ClusterRole
    name: dojo-backup-snapshot-classes
  patch: |-
    - op: replace
      path: /metadata/name
      value: dojo-backup-snapshot-classes-staging
- target:
    kind: ClusterRoleBinding
    name: dojo-backup-snapshot-classes
  patch: |-
    - op: replace
      path: /metadata/name
      value: dojo-backup-snapshot-classes-staging
    - op: replace
      path: /roleRef/name
      value: dojo-backup-snapshot-classes-staging
    - op: replace
      path: /subjects/0/name
      value: dojo-backup-staging
    - op: replace
      path: /subjects/0/namespace
      value: dojo-staging

patchesStrategicMerge:
- delete-base-pvc.patch.yaml
