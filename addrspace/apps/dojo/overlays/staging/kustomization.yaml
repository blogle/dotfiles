apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dojo-staging

resources:
- github.com/blogle/dojo2//deploy/k8s/base?ref=v0.0.14
- namespace.yaml
- ingress.yaml
- dojo-google-oauth-sealed.yaml

images:
- name: ghcr.io/blogle/dojo2
  newName: ghcr.io/blogle/dojo2
  newTag: v0.0.14
  digest: sha256:4a4b8ca4f80cf66f6b290b3fe0f7f61cdf507631dafae07c5f99362b604b80d2

patches:
- path: pod-spec.patch.yaml
- path: backup-cronjob.patch.yaml
- target:
    kind: ServiceAccount
    name: dojo-backup
  patch: |-
    - op: replace
      path: /metadata/name
      value: dojo-backup-staging
- target:
    kind: ClusterRole
    name: dojo-backup-snapshot-classes
  patch: |-
    - op: replace
      path: /metadata/name
      value: dojo-backup-snapshot-classes-staging
- target:
    kind: ClusterRoleBinding
    name: dojo-backup-snapshot-classes
  patch: |-
    - op: replace
      path: /metadata/name
      value: dojo-backup-snapshot-classes-staging
    - op: replace
      path: /roleRef/name
      value: dojo-backup-snapshot-classes-staging
    - op: replace
      path: /subjects/0/name
      value: dojo-backup-staging
    - op: replace
      path: /subjects/0/namespace
      value: dojo-staging

patchesStrategicMerge:
- delete-base-pvc.patch.yaml
