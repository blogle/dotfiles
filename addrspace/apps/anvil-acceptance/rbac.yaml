# Namespace-scoped API permissions only. No ClusterRoleBinding and no authority
# over the incumbent production anvil namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: anvil-controller
  namespace: anvil-acceptance
rules:
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes/status"]
    verbs: ["get"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: anvil-controller
  namespace: anvil-acceptance
subjects:
  - kind: ServiceAccount
    name: anvil-controller
    namespace: anvil-acceptance
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: anvil-controller
