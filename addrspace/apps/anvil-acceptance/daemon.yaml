# Intentionally scaled to zero and pointed at a non-existent image tag.
# Must not be scaled up until an immutable Nix-built image digest, real Lease
# adapter, credential delivery, and FS-13 local validation have been approved.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anvil-acceptance
  labels:
    app.kubernetes.io/name: anvil
    app.kubernetes.io/instance: acceptance
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: anvil
      app.kubernetes.io/instance: acceptance
  template:
    metadata:
      labels:
        app.kubernetes.io/name: anvil
        app.kubernetes.io/instance: acceptance
    spec:
      serviceAccountName: anvil-controller
      containers:
        - name: anvil
          image: ghcr.io/blogle/anvil:ACCEPTANCE-IMAGE-NOT-BUILT
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: anvil-acceptance-runtime
          env:
            - name: ANVIL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: anvil-acceptance-runtime
                  key: api-token
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          volumeMounts:
            - name: state
              mountPath: /var/lib/anvil
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: anvil-acceptance-state
---
apiVersion: v1
kind: Service
metadata:
  name: anvil-acceptance
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: anvil
    app.kubernetes.io/instance: acceptance
  ports:
    - name: http
      port: 8080
      targetPort: http
