apiVersion: v1
kind: ConfigMap
metadata:
  name: nexus-config
  namespace: nexus
data:
  nexus.toml: |
    [server]
    listen_address = "0.0.0.0:8000"

    [server.health]
    enabled = true
    path = "/health"

    [mcp]
    enabled = true
    path = "/mcp"

    [mcp.servers.chadlands]
    protocol = "streamable-http"
    url = "http://markdown-vault-mcp.knowledge.svc.cluster.local:8000/mcp"

    [mcp.servers.github]
    protocol = "streamable-http"
    url = "https://api.githubcopilot.com/mcp/x/all"
    auth.token = "{{ env.GITHUB_PAT }}"

    [mcp.servers.lific]
    protocol = "streamable-http"
    url = "http://lific.lific.svc.cluster.local:3456/mcp"
    auth.token = "{{ env.LIFIC_API_KEY }}"

    [[mcp.servers.lific.headers]]
    rule = "insert"
    name = "Host"
    value = "lific.thejeffer.net"

    [mcp.servers.browser]
    protocol = "streamable-http"
    url = "http://browser-mcp.browser-mcp.svc.cluster.local:8080/mcp"

    [mcp.servers.anvil]
    protocol = "streamable-http"
    url = "http://anvil-mcp.anvil.svc.cluster.local:8081/mcp"

    [mcp.servers.kubernetes]
    protocol = "streamable-http"
    url = "http://kubernetes-mcp.kubernetes-mcp.svc.cluster.local:8080/mcp"

    [llm]
    enabled = false

    [telemetry]
    service_name = "nexus"

    [telemetry.resource_attributes]
    environment = "homelab"
    cluster = "nandstorm"
    component = "mcp-gateway"

    [telemetry.exporters.otlp]
    enabled = true
    endpoint = "http://alloy-otel.observability.svc.cluster.local:4317"
    protocol = "grpc"
