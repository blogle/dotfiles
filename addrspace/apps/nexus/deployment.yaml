apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus
  namespace: nexus
  labels:
    app: nexus
spec:
  replicas: 6
  selector:
    matchLabels:
      app: nexus
  template:
    metadata:
      labels:
        app: nexus
      annotations:
        checksum/config: 05e815fb3c8e16eb2028b09bda691075da9d4c88249547a2889a259cbf59cb3e
        anvil.example.invalid/mcp-contract-revision: 8d84110f3ae431d92e004d7dbd2cb9befb7fe6e1
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: nexus
          image: ghcr.io/grafbase/nexus@sha256:e904ebe3539b5e75a074c69ad277d531d2483583d4c1d67eb0b64fa23e22312f
          args:
            - --config
            - /etc/nexus/nexus.toml
          env:
            - name: GITHUB_PAT
              valueFrom:
                secretKeyRef:
                  name: github-mcp-credentials
                  key: GITHUB_PAT
            - name: LIFIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nexus-lific-credentials
                  key: LIFIC_API_KEY
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
          volumeMounts:
            - name: config
              mountPath: /etc/nexus
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: nexus-config
