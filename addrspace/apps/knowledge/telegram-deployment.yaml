apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegram-collector
  namespace: knowledge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: telegram-collector
  template:
    metadata:
      labels:
        app: telegram-collector
    spec:
      terminationGracePeriodSeconds: 30
      nodeSelector:
        kubernetes.io/hostname: nandstorm
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: telegram-collector
          image: ghcr.io/blogle/telegram-markdown-collector:v0.1.0
          args:
            - --config
            - /etc/telegram-collector/config.yaml
            - watch
          env:
            - name: TELEGRAM_API_ID
              valueFrom:
                secretKeyRef:
                  name: telegram-credentials
                  key: TELEGRAM_API_ID
            - name: TELEGRAM_API_HASH
              valueFrom:
                secretKeyRef:
                  name: telegram-credentials
                  key: TELEGRAM_API_HASH
          ports:
            - name: health
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/telegram-collector/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: state
              mountPath: /state
            - name: vault
              mountPath: /output
      volumes:
        - name: config
          configMap:
            name: telegram-collector-config
        - name: state
          persistentVolumeClaim:
            claimName: telegram-collector-state-zfs
        - name: vault
          hostPath:
            path: /persist/knowledge/vaults/The Chadlands/70 Sources/Telegram
            type: Directory
