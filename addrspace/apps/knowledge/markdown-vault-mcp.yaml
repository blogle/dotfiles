apiVersion: apps/v1
kind: Deployment
metadata:
  name: markdown-vault-mcp
  namespace: knowledge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: markdown-vault-mcp
  template:
    metadata:
      labels:
        app: markdown-vault-mcp
    spec:
      enableServiceLinks: false
      containers:
        - name: markdown-vault-mcp
          image: ghcr.io/blogle/markdown-vault-mcp:downstream-6f29b2e
          ports:
            - name: http
              containerPort: 8000
          args:
            - markdown-vault-mcp
            - serve
            - --transport
            - http
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --http-path
            - /mcp
          env:
            - name: MARKDOWN_VAULT_MCP_SOURCE_DIR
              value: /data/vaults
            - name: MARKDOWN_VAULT_MCP_VAULT_ID
              value: nandstorm-knowledge
            - name: MARKDOWN_VAULT_MCP_READ_ONLY
              value: "false"
            - name: MARKDOWN_VAULT_MCP_INDEX_PATH
              value: /data/state/index.db
            - name: MARKDOWN_VAULT_MCP_EMBEDDINGS_PATH
              value: /data/state/embeddings/embeddings
            - name: MARKDOWN_VAULT_MCP_STATE_PATH
              value: /data/state/state.json
            - name: MARKDOWN_VAULT_MCP_KV_STORE_URL
              value: file:///data/state/kv
            - name: MARKDOWN_VAULT_MCP_EMBEDDING_PROVIDER
              value: ollama
            - name: OLLAMA_HOST
              value: http://ollama.ai.svc.cluster.local:11434
            - name: MARKDOWN_VAULT_MCP_OLLAMA_MODEL
              value: qwen3-embedding:0.6b
            - name: MARKDOWN_VAULT_MCP_OLLAMA_CPU_ONLY
              value: "false"
            - name: MARKDOWN_VAULT_MCP_FILE_WATCHER
              value: "true"
            - name: MARKDOWN_VAULT_MCP_FILE_WATCHER_DEBOUNCE_S
              value: "2.0"
            - name: MARKDOWN_VAULT_MCP_EXCLUDE
              value: .obsidian/**,.trash/**,.git/**
            - name: MARKDOWN_VAULT_MCP_INDEXED_FIELDS
              value: tags,aliases,type,status,year,knowledge_scope,retrieval_tier,turn,lifecycle
            - name: MARKDOWN_VAULT_MCP_DISABLE_APPS_UI
              value: "true"
            - name: MARKDOWN_VAULT_MCP_BUILD_TIMEOUT_S
              value: "14400"
            - name: FASTMCP_ENABLE_RICH_LOGGING
              value: "false"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 3Gi
          startupProbe:
            exec:
              command:
                - python
                - -c
                - import socket; socket.create_connection(("127.0.0.1", 8000), 2).close()
            failureThreshold: 60
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - |
                  import json
                  import urllib.request

                  url = "http://127.0.0.1:8000/mcp"
                  host = "markdown-vault-mcp.thejeffer.net"
                  payload = json.dumps({
                      "jsonrpc": "2.0",
                      "id": 1,
                      "method": "initialize",
                      "params": {
                          "protocolVersion": "2025-03-26",
                          "capabilities": {},
                          "clientInfo": {"name": "readiness-probe", "version": "1"},
                      },
                  }).encode()
                  request = urllib.request.Request(
                      url,
                      data=payload,
                      headers={
                          "Host": host,
                          "Content-Type": "application/json",
                          "Accept": "application/json, text/event-stream",
                      },
                  )
                  session_id = None
                  try:
                      with urllib.request.urlopen(request, timeout=5) as response:
                          if response.status != 200:
                              raise RuntimeError(f"MCP initialize returned HTTP {response.status}")
                          session_id = response.headers.get("mcp-session-id")
                          if not session_id:
                              raise RuntimeError("MCP initialize returned no session ID")
                          events = response.read().decode()
                      message = next(line[6:] for line in events.splitlines() if line.startswith("data: "))
                      result = json.loads(message).get("result", {})
                      if result.get("protocolVersion") != "2025-03-26":
                          raise RuntimeError("MCP initialize returned an invalid protocol response")
                  finally:
                      if session_id:
                          close_request = urllib.request.Request(
                              url,
                              method="DELETE",
                              headers={"Host": host, "MCP-Session-Id": session_id},
                          )
                          with urllib.request.urlopen(close_request, timeout=5):
                              pass
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - import socket; socket.create_connection(("127.0.0.1", 8000), 2).close()
            periodSeconds: 30
            timeoutSeconds: 2
          volumeMounts:
            - name: state
              mountPath: /data/state
            - name: vaults
              mountPath: /data/vaults
        - name: tunnel-client
          image: alpine@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
          command:
            - /bin/sh
            - -ec
            - |
              until nc -z 127.0.0.1 8000; do
                sleep 1
              done
              exec /usr/local/bin/tunnel-client run
          env:
            - name: CONTROL_PLANE_TUNNEL_ID
              valueFrom:
                secretKeyRef:
                  name: tunnel-credentials
                  key: CONTROL_PLANE_TUNNEL_ID
            - name: CONTROL_PLANE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: tunnel-credentials
                  key: CONTROL_PLANE_API_KEY
            - name: MCP_SERVER_URL
              value: http://127.0.0.1:8000/mcp
            - name: HEALTH_LISTEN_ADDR
              value: :8080
            - name: LOG_LEVEL
              value: info
            - name: LOG_FORMAT
              value: json
          startupProbe:
            httpGet:
              path: /readyz
              port: 8080
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: tunnel-client
              mountPath: /usr/local/bin/tunnel-client
              readOnly: true
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: markdown-vault-mcp-state-zfs
        - name: vaults
          hostPath:
            path: /persist/knowledge/vaults
            type: DirectoryOrCreate
        - name: tunnel-client
          hostPath:
            path: /run/current-system/sw/bin/tunnel-client
            type: File
---
apiVersion: v1
kind: Service
metadata:
  name: markdown-vault-mcp
  namespace: knowledge
spec:
  type: ClusterIP
  selector:
    app: markdown-vault-mcp
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: markdown-vault-mcp
  namespace: knowledge
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - markdown-vault-mcp.thejeffer.net
      secretName: markdown-vault-mcp-tls
  rules:
    - host: markdown-vault-mcp.thejeffer.net
      http:
        paths:
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: markdown-vault-mcp
                port:
                  name: http
