apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ollama-alerts
  namespace: ai
  labels:
    app: ollama
spec:
  groups:
    - name: ai.ollama
      interval: 30s
      rules:
        - alert: OllamaUnavailable
          expr: kube_deployment_status_replicas_available{namespace="ai",deployment="ollama"} < 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Ollama is unavailable"
            description: "The shared Ollama deployment has had no available replica for 10 minutes."
        - alert: OllamaCrashLooping
          expr: increase(kube_pod_container_status_restarts_total{namespace="ai",container="ollama"}[1h]) > 5
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Ollama is repeatedly restarting"
            description: "The Ollama container restarted more than five times in one hour."
        - alert: OllamaModelStorageFilling
          expr: |
            kubelet_volume_stats_used_bytes{namespace="ai",persistentvolumeclaim="ollama-models"}
              / kubelet_volume_stats_capacity_bytes{namespace="ai",persistentvolumeclaim="ollama-models"} > 0.80
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Ollama model storage above 80%"
            description: "The Ollama model PVC has remained above 80% used for 15 minutes."
    - name: ai.gpu
      interval: 30s
      rules:
        - alert: NvidiaGpuTemperatureHigh
          expr: DCGM_FI_DEV_GPU_TEMP > 85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "NVIDIA GPU temperature above 85 C"
            description: "GPU {{ $labels.gpu }} on {{ $labels.Hostname }} has exceeded 85 C for 10 minutes."
        - alert: NvidiaGpuXidError
          expr: increase(DCGM_FI_DEV_XID_ERRORS[5m]) > 0
          labels:
            severity: critical
          annotations:
            summary: "NVIDIA GPU XID error detected"
            description: "GPU {{ $labels.gpu }} on {{ $labels.Hostname }} reported an XID hardware/driver error."
