apiVersion: batch/v1
kind: Job
metadata:
  name: anvil-provider-catalog-check-20261014
  namespace: anvil
  labels:
    app.kubernetes.io/name: anvil-diagnostics
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: anvil-diagnostics
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      containers:
        - name: inspect
          image: python:3.13-alpine
          imagePullPolicy: IfNotPresent
          command: [python, -c]
          args:
            - |
              import base64, collections, json, os, urllib.error, urllib.request
              secret = os.environ['ANVIL_OPENCODE_SERVER_PASSWORD']
              authorization = base64.b64encode(('opencode:' + secret).encode()).decode()
              def fetch(path):
                  req = urllib.request.Request('http://anvil-profile.anvil.svc.cluster.local:4096' + path,
                      headers={'Authorization': 'Basic ' + authorization})
                  try:
                      with urllib.request.urlopen(req, timeout=20) as res:
                          return json.load(res)
                  except urllib.error.HTTPError as err:
                      print(json.dumps({'path':path,'status':err.code,'error':'HTTP error'}), flush=True)
                      raise SystemExit(1)
              info = fetch('/api/info')
              print(json.dumps({'probe':'version','version':info.get('version', info.get('data',{}).get('version'))}), flush=True)
              models = fetch('/api/model').get('data', [])
              counts = collections.Counter((x.get('providerID'),x.get('enabled')) for x in models)
              print(json.dumps({'probe':'catalog','total':len(models),
                  'providers':[{'id':provider,'enabled':enabled,'count':count}
                               for (provider,enabled),count in sorted(counts.items(), key=lambda item: str(item[0]))]}), flush=True)
              print(json.dumps({'probe':'openai-models','models':[
                  {'id':m.get('modelID'),'enabled':m.get('enabled')}
                  for m in models if m.get('providerID') == 'openai']}), flush=True)
              if not models:
                  raise SystemExit('model catalog unexpectedly empty')
          env:
            - name: ANVIL_OPENCODE_SERVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: github-app-credentials
                  key: ANVIL_OPENCODE_SERVER_PASSWORD
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              cpu: 100m
              memory: 128Mi
