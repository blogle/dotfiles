---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: github-app-credentials
  namespace: anvil
spec:
  encryptedData:
    ANVIL_GITHUB_APP_ID: 
    ANVIL_GITHUB_INSTALLATION_ID: 
    ANVIL_GITHUB_PRIVATE_KEY: 
    ANVIL_SESSION_SIGNING_SECRET: 
  template:
    metadata:
      name: github-app-credentials
      namespace: anvil
    type: Opaque
