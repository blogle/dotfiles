apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: anvil

resources:
  - github.com/blogle/anvil//k8s/base?ref=9fdd0b9f5a72236c63770d0e95e89b784c9cadda
  - certificate.yaml
  - ingress.yaml
  - github-app-credentials-anvil.sealed.yaml

images:
  - name: ghcr.io/blogle/anvil
    newTag: sha-9fdd0b9f5a72236c63770d0e95e89b784c9cadda
  - name: ghcr.io/blogle/anvil-sandbox
    newTag: sha-9fdd0b9f5a72236c63770d0e95e89b784c9cadda
  - name: ghcr.io/blogle/anvil-nix-daemon
    newTag: sha-9fdd0b9f5a72236c63770d0e95e89b784c9cadda

patches:
  - path: runtime-config.patch.yaml
  - path: profile-pvc.patch.yaml
  - path: profile-deployment.patch.yaml
  - path: nix-shared-pvc.patch.yaml
  - path: history-pvc.patch.yaml
  - path: anvild-rollout.patch.yaml

replacements:
  - source:
      kind: ConfigMap
      name: anvil-runtime
      fieldPath: data.ANVIL_PREVIEW_DOMAIN
    targets:
      - select:
          kind: Deployment
          name: anvild
        fieldPaths:
          - spec.template.metadata.annotations.[anvil.thejeffer.net/runtime-config-preview-domain]
  - source:
      kind: ConfigMap
      name: anvil-runtime
      fieldPath: data.ANVIL_ANNOTATION_PREFIX
    targets:
      - select:
          kind: Deployment
          name: anvild
        fieldPaths:
          - spec.template.metadata.annotations.[anvil.thejeffer.net/runtime-config-annotation-prefix]
  - source:
      kind: ConfigMap
      name: anvil-runtime
      fieldPath: data.ANVIL_GIT_COMMITTER_NAME
    targets:
      - select:
          kind: Deployment
          name: anvild
        fieldPaths:
          - spec.template.metadata.annotations.[anvil.thejeffer.net/runtime-config-git-committer-name]
  - source:
      kind: ConfigMap
      name: anvil-runtime
      fieldPath: data.ANVIL_GIT_COMMITTER_EMAIL
    targets:
      - select:
          kind: Deployment
          name: anvild
        fieldPaths:
          - spec.template.metadata.annotations.[anvil.thejeffer.net/runtime-config-git-committer-email]
  - source:
      kind: ConfigMap
      name: anvil-runtime
      fieldPath: data.ANVIL_CONCURRENCY
    targets:
      - select:
          kind: Deployment
          name: anvild
        fieldPaths:
          - spec.template.metadata.annotations.[anvil.thejeffer.net/runtime-config-concurrency]
  - source:
      kind: ConfigMap
      name: anvil-runtime
      fieldPath: data.BASE_DOMAIN
    targets:
      - select:
          kind: Deployment
          name: anvild
        fieldPaths:
          - spec.template.metadata.annotations.[anvil.thejeffer.net/runtime-config-base-domain]
  - source:
      kind: ConfigMap
      name: anvil-runtime
      fieldPath: data.AGENT_SANDBOX_ROUTER_URL
    targets:
      - select:
          kind: Deployment
          name: anvild
        fieldPaths:
          - spec.template.metadata.annotations.[anvil.thejeffer.net/runtime-config-sandbox-router-url]
  - source:
      kind: Deployment
      name: anvil-profile
      fieldPath: spec.template.spec.containers.0.image
    targets:
      - select:
          kind: ConfigMap
          name: anvil-runtime
        fieldPaths:
          - data.ANVIL_SANDBOX_IMAGE
  - source:
      kind: ConfigMap
      name: anvil-runtime
      fieldPath: data.ANVIL_SANDBOX_IMAGE
    targets:
      - select:
          kind: Deployment
          name: anvild
        fieldPaths:
          - spec.template.metadata.annotations.[anvil.thejeffer.net/runtime-config-sandbox-image]