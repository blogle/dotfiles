apiVersion: apps/v1
kind: Deployment
metadata:
  name: anvild
spec:
  # Keep the singleton controller from overlapping on its ReadWriteOnce history PVC;
  # API requests may see a brief interruption while the new pod starts and rehydrates.
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        anvil.thejeffer.net/runtime-config-preview-domain: ""
        anvil.thejeffer.net/runtime-config-annotation-prefix: ""
        anvil.thejeffer.net/runtime-config-git-committer-name: ""
        anvil.thejeffer.net/runtime-config-git-committer-email: ""
        anvil.thejeffer.net/runtime-config-concurrency: ""
        anvil.thejeffer.net/runtime-config-base-domain: ""
        anvil.thejeffer.net/runtime-config-sandbox-router-url: ""
        anvil.thejeffer.net/runtime-config-sandbox-image: ""
